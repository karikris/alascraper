name: Patch alascraper safety fixes

on:
  push:
    paths:
      - .github/workflows/patch-alascraper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alascraper and README
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing expected text:\n{old}")
              return text.replace(old, new, 1)

          p = Path("alascraper.py")
          s = p.read_text()

          s = replace_once(
              s,
              "  - If no LSID is supplied, q=<scientific_name> is used with an exact taxon_name filter.\n"
              "  - CSV output is optional and disabled by default.\n",
              "  - If no LSID is supplied, q=<scientific_name> is used without an exact taxon_name filter by default.\n"
              "  - CSV output is optional and disabled by default.\n"
              "  - Research runs refresh outputs by default; cache/resume must be explicitly enabled.\n"
              "  - Capped runs must use MAX_RECORDS_PER_SPECIES=None or <= SEARCH_API_MAX_WINDOW.\n",
          )

          s = replace_once(
              s,
              "# If True, delete all previous outputs.\n"
              "# If False, existing shard files are reused.\n"
              "FRESH_RUN = False\n",
              "# If True, delete all previous outputs.\n"
              "# Normal research runs should refresh all species by default. Set False only\n"
              "# when intentionally resuming/reusing same-config cached shards.\n"
              "FRESH_RUN = True\n",
          )

          s = replace_once(
              s,
              "def fetch_total_records(\n",
              "def validate_page_records(task: PageTask, records: list[dict[str, Any]]) -> None:\n"
              "    expected = task.page_size\n"
              "    actual = len(records)\n"
              "    if actual == expected:\n"
              "        return\n"
              "    raise RuntimeError(\n"
              "        f\"ALA returned {actual:,} records for species={task.target.key}, \"\n"
              "        f\"partition={task.partition_label!r}, start={task.start:,}, \"\n"
              "        f\"page_size={expected:,}, extra_fq_filters={list(task.extra_fq_filters)!r}; \"\n"
              "        \"refusing to write a partial shard\"\n"
              "    )\n\n\n"
              "def fetch_validated_page(task: PageTask) -> tuple[dict[str, Any], list[dict[str, Any]]]:\n"
              "    last_error: Exception | None = None\n"
              "    for attempt in range(1, MAX_RETRIES + 1):\n"
              "        data = fetch_json(\n"
              "            target=task.target,\n"
              "            start=task.start,\n"
              "            page_size=task.page_size,\n"
              "            fields=task.fields,\n"
              "            extra_fq_filters=task.extra_fq_filters,\n"
              "        )\n"
              "        records = data.get(\"occurrences\", [])\n"
              "        try:\n"
              "            validate_page_records(task, records)\n"
              "            return data, records\n"
              "        except RuntimeError as exc:\n"
              "            last_error = exc\n"
              "            if attempt == MAX_RETRIES:\n"
              "                break\n"
              "            wait = min(120, 2 ** attempt)\n"
              "            log(\n"
              "                f\"Page row-count validation failed for species={task.target.key}, \"\n"
              "                f\"partition={task.partition_label!r}, start={task.start:,}, \"\n"
              "                f\"attempt={attempt}/{MAX_RETRIES}: {exc}. Retrying in {wait}s.\"\n"
              "            )\n"
              "            time.sleep(wait)\n"
              "    raise RuntimeError(\n"
              "        f\"Failed page row-count validation after {MAX_RETRIES} attempts: {last_error}\"\n"
              "    )\n\n\n"
              "def fetch_total_records(\n",
          )

          s = replace_once(
              s,
              "    if path.exists() and path.stat().st_size > 0:\n"
              "        existing_rows = pl.scan_parquet(path).select(pl.len()).collect().item()\n"
              "        return PageResult(\n"
              "            species_key=target.key,\n"
              "            page_index=task.page_index,\n"
              "            start=task.start,\n"
              "            rows=int(existing_rows),\n"
              "            path=path,\n"
              "            reused=True,\n"
              "            partition_label=task.partition_label,\n"
              "        )\n\n"
              "    data = fetch_json(\n"
              "        target=target,\n"
              "        start=task.start,\n"
              "        page_size=task.page_size,\n"
              "        fields=task.fields,\n"
              "        extra_fq_filters=task.extra_fq_filters,\n"
              "    )\n"
              "    records = data.get(\"occurrences\", [])\n",
              "    if path.exists() and path.stat().st_size > 0:\n"
              "        existing_rows = int(pl.scan_parquet(path).select(pl.len()).collect().item())\n"
              "        if existing_rows == task.page_size:\n"
              "            return PageResult(\n"
              "                species_key=target.key,\n"
              "                page_index=task.page_index,\n"
              "                start=task.start,\n"
              "                rows=existing_rows,\n"
              "                path=path,\n"
              "                reused=True,\n"
              "                partition_label=task.partition_label,\n"
              "            )\n"
              "        log(\n"
              "            f\"Cached shard row-count mismatch for species={target.key}, \"\n"
              "            f\"partition={task.partition_label!r}, start={task.start:,}: \"\n"
              "            f\"expected {task.page_size:,}, found {existing_rows:,}. Refetching.\"\n"
              "        )\n"
              "        path.unlink(missing_ok=True)\n\n"
              "    data, records = fetch_validated_page(task)\n",
          )

          s = replace_once(
              s,
              "def fetch_one_species(target: SpeciesTarget, config_fingerprint: str) -> SpeciesResult:\n",
              "def validate_run_settings() -> None:\n"
              "    validate_privacy_settings()\n"
              "    if MAX_RECORDS_PER_SPECIES is not None and MAX_RECORDS_PER_SPECIES > SEARCH_API_MAX_WINDOW:\n"
              "        raise ValueError(\n"
              "            f\"MAX_RECORDS_PER_SPECIES must be None or <= {SEARCH_API_MAX_WINDOW:,}. \"\n"
              "            \"Deterministic capped partitioning above the ALA search window is not implemented.\"\n"
              "        )\n\n\n"
              "def fetch_one_species(target: SpeciesTarget, config_fingerprint: str) -> SpeciesResult:\n",
          )

          s = replace_once(
              s,
              "    validate_privacy_settings()\n"
              "    prepare_output_dirs()\n",
              "    validate_run_settings()\n"
              "    prepare_output_dirs()\n",
          )

          p.write_text(s)

          rpath = Path("README.md")
          r = rpath.read_text()
          r = r.replace("FRESH_RUN = False", "FRESH_RUN = True")
          r = replace_once(
              r,
              "For a small capped run, set:\n",
              "Normal research runs refresh all species by default with `FRESH_RUN = True`. Set it to `False` only when intentionally resuming the same query/config fingerprint.\n\n"
              "Capped runs currently support `MAX_RECORDS_PER_SPECIES = None` or values up to `5_000`. Larger caps are rejected until deterministic capped partitioning is implemented.\n\n"
              "For a small capped run, set:\n",
          )
          rpath.write_text(r)

          Path(".github/workflows/patch-alascraper.yml").unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alascraper.py README.md .github/workflows/patch-alascraper.yml
          git commit -m "Validate ALA page counts and refresh defaults"
          git push

